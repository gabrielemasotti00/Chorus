name: Crea app iPhone

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        working-directory: ios
        run: xcodegen generate

      - name: Compila senza firma (la firma la fa AltStore)
        working-directory: ios
        run: |
          xcodebuild -project Ritornello.xcodeproj -scheme Ritornello \
            -configuration Release -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Crea il file .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Ritornello.app Payload/
          zip -qry Ritornello.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Ritornello-ipa
          path: ios/Ritornello.ipa
