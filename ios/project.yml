name: Ritornello
options:
  bundleIdPrefix: com.ritornello
  deploymentTarget:
    iOS: "16.0"
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    from: "0.4.10"
targets:
  Ritornello:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: YouTubeKit
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Ritornello
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ritornello.app
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
schemes:
  Ritornello:
    build:
      targets:
        Ritornello: all
    run:
      config: Debug
    archive:
      config: Release
